spring:
  application:
    name: aluguel
  config:
    # Lê o arquivo .env (na pasta backend/) com a senha do banco e o segredo do JWT
    import: optional:file:.env[.properties]
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres.qoouopiiybwdiqphvmiw}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000   # milissegundos (24 horas)
  cors:
    origens: ${CORS_ORIGINS:http://localhost:5173}
